name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test
        working-directory: Packages/Core
        run: swift test
      - name: Benchmark regression check (ScanKit vs. du)
        run: scripts/bench-check.sh 200000 0.6
