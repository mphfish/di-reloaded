name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: Packages/Core
        run: swift test
      - name: Benchmark (smoke)
        working-directory: Packages/Core
        run: |
          swift build -c release
          .build/release/dir-bench /usr --top 0
